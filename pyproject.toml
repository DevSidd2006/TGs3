[project]
name = "tgs3"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=41,<46",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "telethon>=1.36,<2.0",
  "uvicorn>=0.30,<1.0",
  "web3>=7,<8",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
