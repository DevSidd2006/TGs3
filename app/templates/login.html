{% extends "base.html" %}
{% block body %}
<div class="login-app">
  <form method="post" action="/login" class="login-card">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="login-brand">
      <img src="/logo/tgs3-logo-light.png" alt="TGS3" class="tgs3-logo tgs3-logo-light" width="40" height="40">
      <img src="/logo/tgs3-logo-dark.png" alt="TGS3" class="tgs3-logo tgs3-logo-dark" width="40" height="40">
      <span class="drive-title">TGS3</span>
    </div>
    <h1>Sign in</h1>
    <p class="login-subtitle">to continue to TGS3</p>
    {% if error %}<div class="login-error"><i class="ph-bold ph-warning-circle"></i> {{ error }}</div>{% endif %}
    <label class="sr-only" for="login-username">Username</label>
    <input id="login-username" class="login-input" type="text" name="username" placeholder="Username" autocomplete="username" autofocus required>
    <label class="sr-only" for="login-password">Password</label>
    <input id="login-password" class="login-input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button class="login-submit" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
