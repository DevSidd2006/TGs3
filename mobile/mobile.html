<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Google Drive - TGS3</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/mobile/icons/icon-192.png">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mobile/mobile.css">
</head>
<body>
  <div class="m-app">
    <!-- Top Search Header -->
    <header class="m-top-bar">
      <div class="m-search-box">
        <img src="/logo/tgs3-logo-light.png" alt="TGS3" class="m-logo tgs3-logo-light" width="30" height="30">
        <img src="/logo/tgs3-logo-dark.png" alt="TGS3" class="m-logo tgs3-logo-dark" width="30" height="30">
        <input id="m-search-input" type="search" placeholder="Search in Drive" autocomplete="off">
        <button class="m-icon-btn" id="m-sync-btn" title="Sync from Telegram Channel"><i class="ph-bold ph-arrows-clockwise" id="m-sync-icon"></i></button>
        <button class="m-icon-btn" id="m-theme-btn" title="Toggle Theme"><i class="ph-bold ph-moon" id="m-theme-icon"></i></button>
        <div class="m-user-avatar" id="m-user-avatar" title="Account">D</div>
      </div>
    </header>

    <!-- Sub Header / Navigation Breadcrumbs -->
    <div class="m-sub-header">
      <div class="m-breadcrumb" id="m-breadcrumb">
        <span class="crumb-active">My Drive</span>
      </div>
      <div class="m-view-toggles">
        <button class="m-icon-btn active" id="m-btn-list" title="List View"><i class="ph-bold ph-list-bullets"></i></button>
        <button class="m-icon-btn" id="m-btn-grid" title="Grid View"><i class="ph-bold ph-squares-four"></i></button>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="m-content-container" id="m-main">
      <!-- Folders Horizontal Section -->
      <section class="m-section" id="m-folders-section">
        <div class="m-section-title">Folders</div>
        <div class="m-folders-grid" id="m-folders-grid">
          <!-- Folders dynamically inserted here -->
        </div>
      </section>

      <!-- Files Section -->
      <section class="m-section">
        <div class="m-section-header">
          <span class="m-section-title">Files</span>
          <span class="m-file-count" id="m-file-count">0 items</span>
        </div>
        <div id="m-empty-state" class="m-empty-state" hidden>
          <i class="ph-duotone ph-folder-open"></i>
          <p>No files in this folder</p>
        </div>
        <div class="m-files-list" id="m-files-list">
          <!-- Files dynamically inserted here -->
        </div>
      </section>
    </main>

    <!-- Floating Action Button (+ FAB) -->
    <div class="m-fab-container">
      <button class="m-fab-btn" id="m-fab-btn" title="Create or Upload">
        <svg class="m-plus-icon" viewBox="0 0 36 36">
          <path fill="#4285F4" d="M16 16v14h4V20z"/>
          <path fill="#34A853" d="M30 16H20l-4 4h14z"/>
          <path fill="#FBBC05" d="M6 20h10l4-4H6z"/>
          <path fill="#EA4335" d="M20 6h-4v10l4 4z"/>
        </svg>
      </button>
    </div>

    <!-- Bottom Navigation Bar (Google Drive Android / iOS Style) -->
    <nav class="m-bottom-nav">
      <button class="nav-item active" data-tab="home">
        <i class="ph-bold ph-house"></i>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="starred">
        <i class="ph-bold ph-star"></i>
        <span>Starred</span>
      </button>
      <button class="nav-item" data-tab="shared">
        <i class="ph-bold ph-users-three"></i>
        <span>Shared</span>
      </button>
      <button class="nav-item" data-tab="files">
        <i class="ph-bold ph-folder"></i>
        <span>Files</span>
      </button>
    </nav>
  </div>

  <!-- Creation Bottom Sheet Modal -->
  <div class="m-modal-backdrop" id="m-create-modal" hidden>
    <div class="m-bottom-sheet">
      <div class="m-sheet-header">
        <h3>Create new</h3>
        <button class="m-icon-btn" id="m-create-close"><i class="ph-bold ph-x"></i></button>
      </div>
      <div class="m-sheet-grid">
        <button class="m-sheet-option" id="m-opt-folder">
          <div class="option-icon bg-blue"><i class="ph-fill ph-folder-plus"></i></div>
          <span>Folder</span>
        </button>
        <button class="m-sheet-option" id="m-opt-upload">
          <div class="option-icon bg-green"><i class="ph-bold ph-upload-simple"></i></div>
          <span>Upload</span>
        </button>
        <button class="m-sheet-option" id="m-opt-upload-folder">
          <div class="option-icon bg-blue"><i class="ph-bold ph-folder-open"></i></div>
          <span>Folder upload</span>
        </button>
        <button class="m-sheet-option" id="m-opt-scan">
          <div class="option-icon bg-yellow"><i class="ph-bold ph-camera"></i></div>
          <span>Scan</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Move / Options Action Sheet Modal -->
  <div class="m-modal-backdrop" id="m-options-modal" hidden>
    <div class="m-bottom-sheet">
      <div class="m-sheet-header">
        <h3 id="m-options-title">File Options</h3>
        <button class="m-icon-btn" id="m-options-close"><i class="ph-bold ph-x"></i></button>
      </div>
      <div class="m-options-list">
        <button class="m-option-row" id="m-action-preview">
          <i class="ph-bold ph-eye"></i>
          <span>Preview</span>
        </button>
        <button class="m-option-row" id="m-action-download">
          <i class="ph-bold ph-download-simple"></i>
          <span>Download</span>
        </button>
        <button class="m-option-row" id="m-action-move">
          <i class="ph-bold ph-folder-notch"></i>
          <span>Move to folder</span>
        </button>
        <button class="m-option-row" id="m-action-logout">
          <i class="ph-bold ph-sign-out"></i>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" id="m-hidden-file-input" multiple hidden>
  <input type="file" id="m-hidden-folder-input" webkitdirectory multiple hidden>

  <!-- Toast Notification -->
  <div id="m-toast" class="m-toast" hidden></div>

  <script src="/mobile/mobile.js" defer></script>
</body>
</html>
